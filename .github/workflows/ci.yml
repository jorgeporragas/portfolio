# Checks every pull request and every push to main. It never deploys: Vercel builds previews and
# production on its own, and Jorge's merge is the deploy (ADR-004). The job names are the check
# names the protect-main ruleset requires.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request makes the older run moot; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # FLOW's checks, from FLOW's system/ci/github-actions.yml. Action versions moved from
  # checkout@v4 and setup-python@v5 to the Node 24 majors: GitHub removed Node 20 from its
  # runners on 2026-09-23.
  flow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit check diffs the pull request against its merge base with main, which a
          # shallow clone does not have.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: flow_check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python .flow/flow_check.py --range "origin/${{ github.base_ref }}..HEAD"
          else
            python .flow/flow_check.py --range "${{ github.event.before }}..${{ github.sha }}"
          fi

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
